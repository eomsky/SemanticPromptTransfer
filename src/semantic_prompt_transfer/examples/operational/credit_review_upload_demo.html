<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>신용심사 자료 업로드</title>
  <style>
    :root { --line:#d9dde3; --navy:#244a73; --navy-soft:#edf4fb; --muted:#68707c; --bg:#f5f6f8; --green:#237249; --red:#b42318; }
    * { box-sizing:border-box; }
    [hidden] { display:none!important; }
    body { margin:0; padding:44px 20px; background:var(--bg); color:#20242b; font:14px Arial,"Noto Sans KR",sans-serif; }
    button { min-width:104px; height:36px; border:1px solid var(--line); border-radius:5px; background:#fff; cursor:pointer; }
    button.primary { border-color:var(--navy); background:var(--navy); color:#fff; }
    button:disabled { cursor:not-allowed; opacity:.45; }
    .panel { width:min(1000px,100%); margin:0 auto 18px; overflow:hidden; border:1px solid var(--line); border-radius:8px; background:#fff; box-shadow:0 3px 14px #1d2a3a14; }
    .auth-panel { width:min(460px,100%); }
    .auth-body { padding:22px 26px 28px; }
    .tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:20px; }
    .tabs button.active { border-color:var(--navy); color:var(--navy); font-weight:bold; }
    .field { display:grid; gap:6px; margin:13px 0; }
    .field label { font-weight:bold; font-size:13px; }
    .field input { width:100%; height:38px; padding:0 11px; border:1px solid var(--line); border-radius:5px; }
    .form-help { margin:10px 0 18px; color:var(--muted); font-size:12px; line-height:1.55; }
    .form-error { min-height:18px; margin:8px 0; color:var(--red); font-size:12px; }
    .wide { width:100%; }
    .header-line { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
    .header-line button { min-width:74px; height:30px; font-size:12px; }
    header { padding:22px 26px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:21px; }
    header p { margin:6px 0 0; color:var(--muted); font-size:13px; }
    .runtime { display:inline-flex; align-items:center; gap:7px; margin-top:10px; color:var(--muted); font-size:12px; }
    .runtime::before { width:8px; height:8px; border-radius:50%; background:#9aa2ad; content:""; }
    .runtime.ready::before { background:var(--green); }
    .runtime.failed::before { background:var(--red); }
    .rows { padding:10px 26px 26px; }
    .row { display:grid; grid-template-columns:minmax(180px,1fr) minmax(224px,auto) minmax(270px,1.4fr); align-items:center; gap:18px; min-height:84px; border-bottom:1px solid #e8eaed; }
    .row:last-child { border:0; }
    .label { display:flex; flex-direction:column; gap:5px; }
    .label strong { font-size:15px; }
    .label small { color:var(--muted); line-height:1.45; }
    .row-actions { display:flex; gap:8px; }
    .progress-wrap { display:grid; gap:7px; }
    .status { display:grid; grid-template-columns:1fr 44px; align-items:center; gap:12px; }
    .track { height:8px; overflow:hidden; border-radius:10px; background:#d9e2eb; }
    .bar { width:0; height:100%; background:var(--navy); transition:width .15s linear; }
    .status span { color:#4f5965; font-size:13px; text-align:right; }
    .current-stage { min-height:17px; color:#45576b; font-size:12px; line-height:1.45; }
    .inline-files { display:flex; flex-wrap:wrap; align-items:center; gap:7px; min-height:38px; }
    .inline-empty { color:var(--muted); font-size:12px; }
    .file-chip { display:inline-flex; max-width:100%; align-items:center; gap:7px; padding:7px 8px 7px 10px; border:1px solid var(--line); border-radius:5px; background:#f8f9fb; }
    .file-chip-name { max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .file-chip-stage { color:var(--muted); font-size:11px; white-space:nowrap; }
    .file-x { min-width:22px; width:22px; height:22px; padding:0; border:0; border-radius:50%; background:#e6e9ed; color:#46505c; font-size:15px; line-height:20px; }
    .file-x:hover { background:var(--red); color:#fff; }
    input[type=file] { display:none; }
    .conversation { border-top:3px solid var(--navy); }
    .conversation-header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfd; }
    .conversation-header h2 { margin:0; font-size:16px; }
    .live { display:inline-flex; align-items:center; gap:7px; color:var(--muted); font-size:12px; }
    .live::before { width:8px; height:8px; border-radius:50%; background:#aab1b9; content:""; }
    .live.active::before { background:var(--green); box-shadow:0 0 0 4px #23724918; }
    .conversation-body { min-height:180px; max-height:520px; overflow:auto; padding:18px 22px 26px; background:#fafbfc; }
    .empty-conversation { margin:45px auto; color:var(--muted); text-align:center; line-height:1.7; }
    .section-message { margin:0 0 14px; padding:15px 17px; border:1px solid #dbe3ec; border-radius:8px; background:#fff; }
    .section-title { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:9px; color:var(--navy); font-weight:bold; }
    .section-state { color:var(--muted); font-size:11px; font-weight:normal; }
    .section-text { margin:0; color:#29313a; line-height:1.75; white-space:pre-wrap; word-break:keep-all; }
    .claim { min-width:0; height:auto; padding:2px 4px; border:0; border-bottom:1px dashed var(--navy); border-radius:2px; background:#fff8ce; color:#1f4167; font:inherit; line-height:1.75; text-align:left; }
    .claim:hover { background:#ffef98; }
    .evidence-tag { min-width:0; height:auto; margin-left:5px; padding:2px 7px; border:0; border-radius:9px; background:#dfeafb; color:#315b87; font-size:10px; vertical-align:middle; }
    .evidence-tag:hover { background:#c8dcf3; }
    .modal-backdrop { position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; padding:20px; background:#17212dcc; }
    .modal { width:min(1400px,96vw); height:min(94vh,980px); display:flex; flex-direction:column; overflow:hidden; border-radius:10px; background:#fff; box-shadow:0 18px 70px #0007; }
    .modal-header { z-index:2; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 20px; border-bottom:1px solid var(--line); background:#fff; }
    .modal-actions { display:flex; align-items:center; gap:7px; }
    .zoom-button { min-width:38px; width:auto; height:32px; padding:0 10px; }
    .modal-title { margin:0 0 5px; font-size:17px; }
    .modal-meta { color:var(--muted); font-size:12px; }
    .modal-close { min-width:34px; width:34px; height:32px; font-size:18px; }
    .modal-body { flex:1; overflow:auto; padding:24px; background:#dfe4ea; }
    .capture-canvas { width:max-content; min-width:100%; display:flex; align-items:flex-start; justify-content:center; }
    .capture { display:block; max-width:none; height:auto; border:1px solid #9da8b4; background:#fff; box-shadow:0 3px 18px #17212d2b; image-rendering:auto; }
    .capture-loading { padding:65px 20px; color:var(--muted); text-align:center; }
    @media(max-width:760px){ body{padding:20px 12px}.row{grid-template-columns:1fr;gap:10px;padding:18px 0}.row-actions{flex-wrap:wrap}.inline-files,.progress-wrap{grid-column:1}.rows{padding:10px 18px 20px}header{padding:20px 18px}.file-chip-name{max-width:180px}.conversation-body{padding:15px}.modal-body{padding:10px} }
  </style>
</head>
<body>
  <div id="application">
    <main class="panel" id="appPanel">
      <header><div class="header-line"><div><h1>신용심사 자료 업로드</h1><p id="userSummary">로그인 없는 시간 제한형 Colab POC</p></div></div><div class="runtime" id="runtimeStatus">서버 확인 전</div></header>
      <section class="rows">
        <div class="row">
          <div class="label"><strong>신용조사서(선택)</strong><small>엑셀 파일 0~1개 · 첨부 시 제1우선순위 근거</small></div>
          <div class="row-actions"><button class="api-action" type="button" onclick="creditInput.click()">업로드</button><button class="api-action" id="templateButton" type="button">양식 다운로드</button></div>
          <div class="inline-files" id="creditFiles"><span class="inline-empty">업로드된 파일 없음</span></div>
          <input id="creditInput" type="file" accept=".xlsx">
        </div>
        <div class="row">
          <div class="label"><strong>기타 첨부자료</strong><small>복수 파일 선택 가능</small></div>
          <button class="api-action" type="button" onclick="attachmentInput.click()">업로드</button>
          <div class="inline-files" id="attachmentFiles"><span class="inline-empty">업로드된 파일 없음</span></div>
          <input id="attachmentInput" type="file" multiple accept=".pdf,.docx,.xlsx,.txt,.md">
        </div>
        <div class="row">
          <div class="label"><strong>심사의견</strong><small id="reportHelp">생성을 누르면 문서 분석과 벡터 임베딩을 시작합니다.</small></div>
          <div class="row-actions"><button class="primary" id="generateButton" type="button" disabled>심사의견 생성</button><button id="downloadButton" type="button" disabled>Word 다운로드</button></div>
          <div class="progress-wrap"><div class="status"><div class="track"><div class="bar" id="reportBar"></div></div><span id="reportText">0%</span></div><div class="current-stage" id="currentStage">업로드 대기 중</div></div>
        </div>
      </section>
    </main>

    <section class="panel conversation" aria-label="심사의견 실시간 생성창">
      <div class="conversation-header"><h2>심사의견 생성 내용</h2><div class="live" id="liveStatus">대기 중</div></div>
      <div class="conversation-body" id="conversationBody"><div class="empty-conversation" id="emptyConversation">심사의견 생성 버튼을 누르면 A~E 항목이 순서대로 표시됩니다.<br>노란색 근거 연결 문구를 누르면 원문 위치가 팝업으로 열립니다.</div></div>
    </section>
  </div>

  <div class="modal-backdrop" id="evidenceModal" role="dialog" aria-modal="true" aria-labelledby="evidenceTitle" hidden>
    <div class="modal">
      <div class="modal-header"><div><h3 class="modal-title" id="evidenceTitle">근거 원문</h3><div class="modal-meta" id="evidenceMeta"></div></div><div class="modal-actions"><button class="zoom-button" id="zoomOut" type="button" aria-label="축소">−</button><button class="zoom-button" id="zoomReset" type="button">100%</button><button class="zoom-button" id="zoomIn" type="button" aria-label="확대">＋</button><button class="modal-close" id="modalClose" type="button" aria-label="팝업 닫기">×</button></div></div>
      <div class="modal-body" id="modalBody"><div class="capture-loading">근거 원문을 불러오는 중입니다.</div></div>
    </div>
  </div>

  <script>
    const params=new URLSearchParams(location.search); const configured=window.SPT_CONFIG||{};
    const apiBase=(params.get('api_base')||configured.apiBase||'').replace(/\/$/,''); const apiMode=params.get('mode')==='api'||Boolean(apiBase);
    const anonymousKey='sptAnonymousClientV1';const newAnonymousId=()=>{if(crypto.randomUUID)return crypto.randomUUID().replace(/[^a-z0-9-]/gi,'');const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);return [...bytes].map(value=>value.toString(16).padStart(2,'0')).join('');};let anonymousId=localStorage.getItem(anonymousKey);if(!anonymousId){anonymousId=newAnonymousId();localStorage.setItem(anonymousKey,anonymousId);}let tenantId=`poc-${anonymousId}`,caseId=`case-${anonymousId}`,runtimeMinutes=0,evidenceObjectUrl='',evidenceZoom=1,evidenceBaseWidth=0;
    const state={credit:[],attachments:[],report:0,jobId:null,lastSequence:0,sections:{},complete:false};
    const byId=id=>document.getElementById(id); const creditInput=byId('creditInput'); const attachmentInput=byId('attachmentInput');
    const generateButton=byId('generateButton'),downloadButton=byId('downloadButton'),runtimeStatus=byId('runtimeStatus');

    const setRuntime=(text,kind='')=>{runtimeStatus.textContent=text;runtimeStatus.className=`runtime ${kind}`;document.querySelectorAll('.api-action').forEach(button=>button.disabled=apiMode&&kind!=='ready');};
    const apiFetch=async(path,options={})=>fetch(`${apiBase}${path}`,options);
    const sleep=milliseconds=>new Promise(resolve=>setTimeout(resolve,milliseconds));

    const sizeOf=bytes=>bytes<1048576?`${Math.max(1,Math.round(bytes/1024))} KB`:`${(bytes/1048576).toFixed(1)} MB`;
    const stageLabel=file=>file.stage==='업로드 완료'?file.stage:`${file.stage||'처리 중'} (${file.progress}%)`;
    const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const inlineFiles=(files,key)=>files.length?files.map(file=>`<span class="file-chip" title="${escapeHtml(file.name)} · ${sizeOf(file.size)}"><span class="file-chip-name">${escapeHtml(file.name)}</span><span class="file-chip-stage">${escapeHtml(stageLabel(file))}</span><button class="file-x" type="button" aria-label="${escapeHtml(file.name)} 삭제" onclick="deleteItem('${key}','${file.id}')">×</button></span>`).join(''):'<span class="inline-empty">업로드된 파일 없음</span>';
    const renderFileLists=()=>{byId('creditFiles').innerHTML=inlineFiles(state.credit,'credit');byId('attachmentFiles').innerHTML=inlineFiles(state.attachments,'attachments');};
    const setProgress=(value,message)=>{state.report=Math.max(0,Math.min(100,Number(value)||0));byId('reportBar').style.width=`${state.report}%`;byId('reportText').textContent=state.report===100?'완료':`${state.report}%`;if(message)byId('currentStage').textContent=message;};
    const syncMainProgress=()=>{generateButton.disabled=!(state.credit.length||state.attachments.length)||Boolean(state.jobId&&!state.complete);downloadButton.disabled=!(state.jobId&&state.complete);renderFileLists();};
    const convertUpload=row=>({id:row.document_id,name:row.filename,size:row.size_bytes||0,progress:row.progress_percent||0,stage:row.progress_stage||'업로드 완료'});
    const loadUploads=async()=>{const response=await apiFetch(`/api/v1/cases/${encodeURIComponent(caseId)}/documents?tenant_id=${encodeURIComponent(tenantId)}`);if(!response.ok)throw new Error(`자료현황 조회 실패 (${response.status})`);const payload=await response.json();state.credit=(payload.credit_report||[]).map(convertUpload);state.attachments=(payload.attachments||[]).map(convertUpload);syncMainProgress();};
    const resetReview=()=>{state.report=0;state.jobId=null;state.lastSequence=0;state.sections={};state.complete=false;setProgress(0,'업로드 완료 · 생성 대기 중');generateButton.textContent='심사의견 생성';byId('reportHelp').textContent='생성을 누르면 문서 분석과 벡터 임베딩을 시작합니다.';byId('liveStatus').textContent='대기 중';byId('liveStatus').className='live';byId('conversationBody').innerHTML='<div class="empty-conversation">심사의견 생성 버튼을 누르면 A~E 항목이 순서대로 표시됩니다.<br>노란색 근거 연결 문구를 누르면 원문 위치가 팝업으로 열립니다.</div>';syncMainProgress();};

    window.deleteItem=async(key,id)=>{if(!confirm('서버에 적재된 파일과 해당 파일의 임베딩 벡터를 모두 삭제합니다.'))return;if(apiMode){const response=await apiFetch(`/api/v1/cases/${encodeURIComponent(caseId)}/documents/${encodeURIComponent(id)}?tenant_id=${encodeURIComponent(tenantId)}`,{method:'DELETE'});if(!response.ok){alert(`삭제 실패 (${response.status})`);return;}await loadUploads();}else{state[key]=state[key].filter(file=>file.id!==id);}resetReview();};
    const localUpload=(files,key,replace)=>{const incoming=files.map((file,index)=>({id:`${Date.now()}-${index}`,name:file.name,size:file.size,progress:0,stage:'업로드 완료'}));state[key]=replace?incoming:[...state[key],...incoming];resetReview();};
    const apiUpload=async(endpoint,files)=>{for(const file of files){const form=new FormData();form.append('file',file);const response=await apiFetch(`/api/v1/cases/${encodeURIComponent(caseId)}/${endpoint}?tenant_id=${encodeURIComponent(tenantId)}`,{method:'POST',body:form});if(!response.ok)throw new Error(`업로드 실패 (${response.status})`);}await loadUploads();resetReview();};
    creditInput.addEventListener('change',async()=>{if(creditInput.files.length){try{apiMode?await apiUpload('credit-report',[creditInput.files[0]]):localUpload([creditInput.files[0]],'credit',true);}catch(error){alert(error.message);}}creditInput.value='';});
    attachmentInput.addEventListener('change',async()=>{if(attachmentInput.files.length){try{apiMode?await apiUpload('attachments',[...attachmentInput.files]):localUpload([...attachmentInput.files],'attachments',false);}catch(error){alert(error.message);}}attachmentInput.value='';});
    byId('templateButton').addEventListener('click',async()=>{try{const response=apiMode?await apiFetch('/api/v1/templates/credit-report.xlsx'):await fetch('credit_report_sample_template.xlsx');if(!response.ok)throw new Error(`양식 다운로드 실패 (${response.status})`);const blob=await response.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='양식_신용조사서.xlsx';link.click();URL.revokeObjectURL(url);}catch(error){alert(error.message);}});

    const ensureSection=(item,title='')=>{if(state.sections[item])return state.sections[item];const empty=byId('emptyConversation');if(empty)empty.remove();const article=document.createElement('article');article.className='section-message';const heading=document.createElement('div');heading.className='section-title';const name=document.createElement('span');name.textContent=`${item}. ${title}`;const stage=document.createElement('span');stage.className='section-state';stage.textContent='생성 중';heading.append(name,stage);const text=document.createElement('p');text.className='section-text';article.append(heading,text);byId('conversationBody').append(article);state.sections[item]={article,text,stage,title,raw:''};return state.sections[item];};
    const citationRegex=/(?:CR|ATT)_[a-f0-9]{20}/gi;
    const visibleOpinion=text=>String(text).replace(/\[\s*(?=(?:CR|ATT)_)(?:(?:CR|ATT)_[a-f0-9]{0,20}\s*,?\s*)*(?:\]|$)/gi,'').replace(/(?:CR|ATT)_[a-f0-9]{20}/gi,'').replace(/\s+([.,;:])/g,'$1').replace(/[ \t]{2,}/g,' ');
    const renderCitedText=(element,text)=>{element.textContent='';const sentences=String(text).match(/[^.!?\n]+(?:[.!?]+|$)|\n+/g)||[String(text)];for(const sentence of sentences){if(/^\n+$/.test(sentence)){element.append(document.createElement('br'));continue;}const ids=[...new Set(sentence.match(citationRegex)||[])];const visible=visibleOpinion(sentence).trim();if(ids.length){const button=document.createElement('button');button.type='button';button.className='claim';button.textContent=visible||'근거 확인';button.addEventListener('click',()=>openEvidence(ids[0]));element.append(button);ids.forEach(id=>{const tag=document.createElement('button');tag.type='button';tag.className='evidence-tag';tag.textContent=id.startsWith('CR_')?'신용조사서 근거':'첨부자료 근거';tag.addEventListener('click',()=>openEvidence(id));element.append(tag);});}else{element.append(document.createTextNode(visible||sentence));}element.append(document.createTextNode(' '));}};
    const updateFileFromEvent=event=>{const file=[...state.credit,...state.attachments].find(row=>row.id===event.document_id);if(file){file.progress=event.file_progress;file.stage=event.file_status==='UPLOADED'?'업로드 완료':event.file_status==='VALIDATING'?'파일검증':event.file_status==='PARSING'?'파일해석':event.file_status==='INDEXING'?'벡터임베딩':event.file_status==='READY'?'완료':event.file_status;renderFileLists();}};
    const handleEvent=event=>{if(event.sequence>state.lastSequence)state.lastSequence=event.sequence;if(event.type==='heartbeat')return;if(Number.isFinite(event.progress))setProgress(event.progress,event.message);if(event.type==='file_progress'){updateFileFromEvent(event);return;}if(event.type==='stage'&&event.review_item){const section=ensureSection(event.review_item,event.message.replace(/^\w\.\s*/,'').replace(/ 생성 (중|완료).*$/,''));section.stage.textContent=event.message.includes('완료')?'완료':'생성 중';}if(event.type==='token'){const section=ensureSection(event.review_item);section.raw+=event.token;section.text.textContent=visibleOpinion(section.raw);byId('conversationBody').scrollTop=byId('conversationBody').scrollHeight;}if(event.type==='section_complete'){const section=ensureSection(event.review_item,event.title);section.raw=event.text;section.stage.textContent='완료 · 근거 연결';renderCitedText(section.text,event.text);}if(event.type==='complete'){state.complete=true;setProgress(100,event.message);generateButton.textContent='생성 완료';generateButton.disabled=true;downloadButton.disabled=false;byId('reportHelp').textContent='심사의견 Word 파일 생성이 완료되었습니다.';byId('liveStatus').textContent='생성 완료';byId('liveStatus').className='live';}if(event.type==='error'){state.complete=false;generateButton.disabled=false;downloadButton.disabled=true;byId('liveStatus').textContent='생성 실패';byId('liveStatus').className='live';alert(`심사의견 생성 실패: ${event.message}`);}};
    const consumeStream=async jobId=>{let failures=0;while(!state.complete&&failures<4){try{const response=await apiFetch(`/api/v1/review-jobs/${encodeURIComponent(jobId)}/stream?after=${state.lastSequence}`);if(!response.ok||!response.body)throw new Error(`실시간 연결 실패 (${response.status})`);const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const {value,done}=await reader.read();buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});const lines=buffer.split('\n');buffer=lines.pop()||'';for(const line of lines){if(line.trim())handleEvent(JSON.parse(line));}if(done){if(buffer.trim())handleEvent(JSON.parse(buffer));break;}}failures=0;if(!state.complete){const current=await apiFetch(`/api/v1/review-jobs/${encodeURIComponent(jobId)}`);if(current.ok){const value=await current.json();if(value.stage==='FAILED'){handleEvent({type:'error',progress:value.progress,message:value.message,sequence:state.lastSequence});return;}if(value.progress===100){handleEvent({type:'complete',progress:100,message:value.message,sequence:state.lastSequence});return;}}await sleep(500);}}catch(error){failures+=1;if(failures>=4){handleEvent({type:'error',progress:state.report,message:error.message,sequence:state.lastSequence});return;}await sleep(1000);}}};
    const runMock=async()=>{const examples={A:'매출채권은 전기 대비 증가하였으나 회전기간과 회수계획을 함께 점검할 필요가 있습니다.',B:'매출 성장에도 원가 부담이 있어 영업수익성의 개선 지속 여부를 확인해야 합니다.',C:'차입금 의존도와 담보여력을 함께 고려할 때 재무안정성은 보수적으로 판단됩니다.',D:'영업현금흐름과 단기성 차입금 만기를 비교하여 상환재원을 점검해야 합니다.',E:'주요 매출처 집중도와 거래 지속성을 중심으로 매출 안정성을 검토합니다.'};for(const [index,item] of ['A','B','C','D','E'].entries()){handleEvent({type:'stage',sequence:++state.lastSequence,progress:32+index*12,message:`${item}. 항목 생성 중 (${index+1}/5)`,review_item:item});for(const word of examples[item].split(' ')){handleEvent({type:'token',sequence:++state.lastSequence,review_item:item,token:word+' '});await sleep(60);}handleEvent({type:'section_complete',sequence:++state.lastSequence,review_item:item,title:'심사항목',text:examples[item],evidence_ids:[]});}handleEvent({type:'complete',sequence:++state.lastSequence,progress:100,message:'심사의견 생성이 완료되었습니다.'});};
    generateButton.addEventListener('click',async()=>{state.sections={};state.lastSequence=0;state.complete=false;byId('conversationBody').innerHTML='<div class="empty-conversation" id="emptyConversation">자료 처리와 A~E 순차 생성을 시작합니다.</div>';byId('liveStatus').textContent='실시간 생성 중';byId('liveStatus').className='live active';generateButton.disabled=true;downloadButton.disabled=true;byId('reportHelp').textContent='자료 해석·벡터 임베딩·심사의견 생성을 진행하고 있습니다.';setProgress(0,'작업 생성 중');if(!apiMode){state.jobId='mock';await runMock();return;}try{const started=await apiFetch(`/api/v1/cases/${encodeURIComponent(caseId)}/review-jobs?tenant_id=${encodeURIComponent(tenantId)}`,{method:'POST'});if(!started.ok){const value=await started.json().catch(()=>({}));throw new Error(value.detail||`생성 시작 실패 (${started.status})`);}const job=await started.json();state.jobId=job.job_id;await consumeStream(state.jobId);}catch(error){handleEvent({type:'error',progress:state.report,message:error.message,sequence:state.lastSequence});}});
    downloadButton.addEventListener('click',async()=>{if(!apiMode){const url=URL.createObjectURL(new Blob(['심사의견 예시'],{type:'application/msword'})),link=document.createElement('a');link.href=url;link.download='심사의견_예시.doc';link.click();URL.revokeObjectURL(url);return;}const response=await apiFetch(`/api/v1/review-jobs/${encodeURIComponent(state.jobId)}/opinion.docx`);if(!response.ok){alert(`다운로드 실패 (${response.status})`);return;}const blob=await response.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='심사의견.docx';link.click();URL.revokeObjectURL(url);});

    const applyEvidenceZoom=()=>{const image=byId('modalBody').querySelector('.capture');if(!image||!evidenceBaseWidth)return;image.style.width=`${Math.round(evidenceBaseWidth*evidenceZoom)}px`;byId('zoomReset').textContent=`${Math.round(evidenceZoom*100)}%`;};
    async function openEvidence(evidenceId){if(!apiMode||!state.jobId){alert('실행 서버에서 생성된 근거만 열 수 있습니다.');return;}byId('evidenceModal').hidden=false;byId('evidenceTitle').textContent='근거 원문';byId('evidenceMeta').textContent='원문 캡처를 불러오는 중입니다.';byId('modalBody').innerHTML='<div class="capture-loading">근거 원문을 불러오는 중입니다.</div>';try{const [metadataResponse,captureResponse]=await Promise.all([apiFetch(`/api/v1/review-jobs/${encodeURIComponent(state.jobId)}/evidence/${encodeURIComponent(evidenceId)}`),apiFetch(`/api/v1/review-jobs/${encodeURIComponent(state.jobId)}/evidence/${encodeURIComponent(evidenceId)}/capture.png`)]);if(!metadataResponse.ok||!captureResponse.ok)throw new Error('근거 원문을 불러오지 못했습니다.');const metadata=await metadataResponse.json(),blob=await captureResponse.blob();if(evidenceObjectUrl)URL.revokeObjectURL(evidenceObjectUrl);evidenceObjectUrl=URL.createObjectURL(blob);byId('evidenceTitle').textContent=metadata.filename;byId('evidenceMeta').textContent=`${metadata.location} · ${metadata.source_tier===3?'첨부자료':'신용조사서'}`;const canvas=document.createElement('div'),image=document.createElement('img');canvas.className='capture-canvas';image.className='capture';image.alt=`${metadata.filename}의 ${metadata.location} 원문`;image.onload=()=>{evidenceZoom=1;evidenceBaseWidth=Math.max(900,Math.round(image.naturalWidth/2));applyEvidenceZoom();};image.src=evidenceObjectUrl;canvas.append(image);byId('modalBody').replaceChildren(canvas);}catch(error){byId('modalBody').innerHTML=`<div class="capture-loading">${escapeHtml(error.message)}</div>`;}};
    const closeModal=()=>{byId('evidenceModal').hidden=true;if(evidenceObjectUrl){URL.revokeObjectURL(evidenceObjectUrl);evidenceObjectUrl='';}};byId('modalClose').addEventListener('click',closeModal);byId('zoomOut').addEventListener('click',()=>{evidenceZoom=Math.max(.5,evidenceZoom-.25);applyEvidenceZoom();});byId('zoomReset').addEventListener('click',()=>{evidenceZoom=1;applyEvidenceZoom();});byId('zoomIn').addEventListener('click',()=>{evidenceZoom=Math.min(3,evidenceZoom+.25);applyEvidenceZoom();});byId('evidenceModal').addEventListener('click',event=>{if(event.target===byId('evidenceModal'))closeModal();});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal();});

    const connect=async()=>{if(!apiMode){setRuntime('화면 예시 모드','ready');syncMainProgress();return;}setRuntime('Colab 서버 연결 중');try{const health=await fetch(`${apiBase}/api/v1/runtime/health`);if(!health.ok)throw new Error(`서버 상태 ${health.status}`);const data=await health.json();runtimeMinutes=Math.max(0,Math.floor((data.remaining_seconds||0)/60));byId('userSummary').textContent=`익명 POC 세션 · ${anonymousId.slice(0,8)}`;setRuntime(`Colab 연결됨 · 약 ${runtimeMinutes}분 남음`,'ready');await loadUploads();}catch(error){setRuntime(error.message,'failed');}};
    connect();
  </script>
</body>
