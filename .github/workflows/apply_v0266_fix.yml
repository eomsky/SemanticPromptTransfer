name: Apply v0.26.6 integration patch

on:
  push:
    branches: [main]
    paths:
      - '.github/v0266_apply.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct, normalize escapes, and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v0266_patch/part*.b64 | base64 -d > /tmp/v0266_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/v0266_patch.py')
          text = path.read_text(encoding='utf-8')
          old1 = "    def stream_chat\\(', '''    def _chat_messages"
          new1 = "    def stream_chat\\(', r'''    def _chat_messages"
          old2 = "updateFileFromEvent=', '''    const renderCitedText"
          new2 = "updateFileFromEvent=', r'''    const renderCitedText"
          if text.count(old1) != 1 or text.count(old2) != 1:
              raise RuntimeError('escape normalization anchors did not match exactly once')
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          compile(text, str(path), 'exec')
          path.write_text(text, encoding='utf-8')
          PY
          python /tmp/v0266_patch.py
          python -m compileall -q src/semantic_prompt_transfer
      - name: Commit integrated v0.26.6 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/v0266_apply.trigger .github/workflows/apply_v0266_fix.yml
          git add -A
          git commit -m 'Apply v0.26.6 integrated architecture'
          git push origin main
