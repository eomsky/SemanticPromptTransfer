name: Release v0.26.9 quality guard

on:
  push:
    paths:
      - '.github/workflows/release_v0269_quality_guard.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch v0.26.9
        shell: bash
        run: |
          cat > /tmp/patch_v0269.py <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def replace_exact(path: str, old: str, new: str, count: int = 1):
              p = root/path
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'missing target in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          # ------------------------------------------------------------------
          # 1. Delete FallbackGenerator entirely. No hidden generation gate remains.
          # ------------------------------------------------------------------
          p = root/'src/semantic_prompt_transfer/llm.py'
          text = p.read_text(encoding='utf-8')
          start = text.index('\n\nclass FallbackGenerator:')
          end = text.index('\n\ndef default_cpu_generator', start)
          text = text[:start] + text[end:]
          text = text.replace(
              'def default_cpu_generator(\n    config: CpuGenerationConfig | None = None,\n) -> FallbackGenerator:\n    return FallbackGenerator(TransformersCpuGenerator(config), EvidenceTemplateGenerator())',
              'def default_cpu_generator(\n    config: CpuGenerationConfig | None = None,\n) -> TransformersCpuGenerator:\n    return TransformersCpuGenerator(config)',
          )
          p.write_text(text, encoding='utf-8')

          replace_exact('src/semantic_prompt_transfer/__init__.py', '    FallbackGenerator,\n', '')
          replace_exact('src/semantic_prompt_transfer/__init__.py', '    "FallbackGenerator",\n', '')

          # Package test: remove obsolete fallback test but retain CPU adapter coverage.
          p = root/'tests/test_package.py'
          text = p.read_text(encoding='utf-8').replace('    FallbackGenerator,\n', '')
          start = text.index('    def test_cpu_generator_adapter_and_grounded_fallback(self):')
          middle = text.index('        class FakeTokenizer:', start)
          replacement = '''    def test_cpu_generator_adapter(self):\n        messages = [{"role": "user", "content": "작성"}]\n\n'''
          text = text[:start] + replacement + text[middle:]
          text = text.replace('self.assertEqual(__version__, "0.26.8")', 'self.assertEqual(__version__, "0.26.9")')
          p.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # 2. Normalize monetary evidence to 백만원 before it reaches the LLM.
          # ------------------------------------------------------------------
          p = root/'src/semantic_prompt_transfer/review.py'
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'import re\nfrom dataclasses import dataclass, replace\n',
              'import re\nfrom decimal import Decimal, InvalidOperation, ROUND_HALF_UP\nfrom dataclasses import dataclass, replace\n',
              1,
          )
          anchor = '_STOPWORDS = {\n    "현재", "자료", "근거", "기준", "관련", "항목", "현황", "향후", "전망", "확인",\n    "신용조사서", "첨부자료", "기타", "해당", "대한", "그리고", "또한", "으로", "에서",\n}\n'
          if anchor not in text:
              raise RuntimeError('review helper anchor missing')
          helpers = anchor + r'''

_MONEY_TO_MILLION = {
    "원": Decimal("0.000001"),
    "천원": Decimal("0.001"),
    "만원": Decimal("0.01"),
    "백만원": Decimal("1"),
    "억원": Decimal("100"),
}
_EXPLICIT_MONEY = re.compile(
    r"(?P<value>\(?[+-]?\d[\d,]*(?:\.\d+)?\)?)\s*(?P<unit>백만원|억원|만원|천원|원)(?![가-힣])"
)


def _money_decimal(value: Any) -> Decimal | None:
    raw = str(value if value is not None else "").strip()
    negative = raw.startswith("(") and raw.endswith(")")
    if negative:
        raw = raw[1:-1].strip()
    raw = raw.replace(",", "")
    try:
        result = Decimal(raw)
    except (InvalidOperation, ValueError):
        return None
    return -result if negative else result


def _format_million(value: Decimal) -> str:
    rounded = value.quantize(Decimal("0.1"), rounding=ROUND_HALF_UP)
    if rounded == rounded.to_integral_value():
        return f"{int(rounded):,}"
    return f"{rounded:,.1f}"


def _normalized_money(value: Any, unit: str | None) -> tuple[str, str | None, bool]:
    normalized_unit = str(unit or "").strip()
    factor = _MONEY_TO_MILLION.get(normalized_unit)
    number = _money_decimal(value)
    if factor is None or number is None:
        return str(value), unit, False
    million = number * factor
    return _format_million(million), "백만원", normalized_unit != "백만원"


def _normalize_explicit_money_text(value: str) -> str:
    def repl(match: re.Match[str]) -> str:
        number, unit, _ = _normalized_money(match.group("value"), match.group("unit"))
        return f"{number}{unit or match.group('unit')}"
    return _EXPLICIT_MONEY.sub(repl, str(value or ""))
'''
          text = text.replace(anchor, helpers, 1)

          old = '''            rendered = f"{fact.field_name}={fact.value}"\n            if fact.unit:\n                rendered += f"; 단위={fact.unit}"\n            if fact.period:\n                rendered += f"; 기간={fact.period}"\n'''
          new = '''            display_value, display_unit, unit_normalized = _normalized_money(fact.value, fact.unit)\n            rendered = f"{fact.field_name}={display_value}"\n            if display_unit:\n                rendered += f"; 단위={display_unit}"\n            if fact.period:\n                rendered += f"; 기간={fact.period}"\n'''
          if old not in text:
              raise RuntimeError('credit fact rendering target missing')
          text = text.replace(old, new, 1)
          old_meta = '''                        "source_hash": fact.source_hash,\n                        "source_class": "credit_report",\n'''
          new_meta = '''                        "source_hash": fact.source_hash,\n                        "source_class": "credit_report",\n                        "raw_value": fact.value,\n                        "raw_unit": fact.unit,\n                        "display_unit": display_unit,\n                        "unit_normalized": unit_normalized,\n'''
          text = text.replace(old_meta, new_meta, 1)
          text = text.replace(
              '                    content=str(hit.get("document") or hit.get("embedding_text") or ""),',
              '                    content=_normalize_explicit_money_text(str(hit.get("document") or hit.get("embedding_text") or "")),',
              1,
          )

          old_policy = (
              '            "문체와 분석 구조만 참고한다. 수치·부호·단위·기간을 임의 변환하거나 계산하지 않는다. "\n'
              '            "각 핵심 주장 문장 끝에는 제공된 [evidence_id]를 붙이고 존재하지 않는 근거 ID를 만들지 않는다."\n'
          )
          new_policy = (
              '            "문체와 분석 구조만 참고한다. 금액은 CURRENT_CASE_EVIDENCE에 표시된 정규화 단위를 그대로 사용한다. "\n'
              '            "심사의견 금액 단위는 백만원을 기본으로 하며 원·천원·만원으로 다시 바꾸거나 한 항목 안에서 혼용하지 않는다. "\n'
              '            "수치·부호·기간을 임의 계산하지 않는다. 각 핵심 주장 문장 끝에는 제공된 [evidence_id]를 붙이고 "\n'
              '            "존재하지 않는 근거 ID를 만들지 않는다."\n'
          )
          if old_policy not in text:
              raise RuntimeError('prompt policy target missing')
          text = text.replace(old_policy, new_policy, 1)
          p.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # 3. Verifier becomes very conservative: only exact MINOR hard conflicts mutate.
          # ------------------------------------------------------------------
          p = root/'src/semantic_prompt_transfer/verification_flow.py'
          text = p.read_text(encoding='utf-8')
          old_codes = '''    _FAIL_REASON_CODES = {\n        "FACT_CONTRADICTION",\n        "UNSUPPORTED_NUMERIC",\n        "UNSUPPORTED_FACT",\n        "UNSUPPORTED_CAUSAL",\n        "PERIOD_MISMATCH",\n        "UNIT_MISMATCH",\n        "SOURCE_CONFLICT",\n    }'''
          new_codes = '''    _FAIL_REASON_CODES = {\n        "FACT_CONTRADICTION",\n        "PERIOD_MISMATCH",\n        "UNIT_MISMATCH",\n        "SOURCE_CONFLICT",\n    }'''
          text = text.replace(old_codes, new_codes, 1)
          text = text.replace(
              '                    "분석 강도의 차이도 WARN 이하로만 판정한다. FAIL은 근거에 의해 명백히 확인되는 수치, "\n'
              '                    "기간, 단위, 사실, 인과관계의 직접 오류가 있을 때만 허용한다. 동일 사실·동일 기간·동일 "\n',
              '                    "분석 강도의 차이, 근거 미제시, 인과 추론의 강도 차이도 WARN 이하로만 판정한다. FAIL은 "\n'
              '                    "근거와 직접 대조해 값·기간·단위·동일 사실이 명백히 충돌하는 경우에만 허용한다. 동일 사실·동일 기간·동일 "\n',
              1,
          )
          text = text.replace(
              '                    "reason_code는 FACT_CONTRADICTION, UNSUPPORTED_NUMERIC, UNSUPPORTED_FACT, "\n'
              '                    "UNSUPPORTED_CAUSAL, PERIOD_MISMATCH, UNIT_MISMATCH, SOURCE_CONFLICT 중 하나만 사용한다."\n',
              '                    "reason_code는 FACT_CONTRADICTION, PERIOD_MISMATCH, UNIT_MISMATCH, SOURCE_CONFLICT 중 하나만 사용한다. "\n'
              '                    "자동 수정이 필요한 경우에도 severity는 MINOR만 사용한다."\n',
              1,
          )
          marker = '''            if reason_code not in self._FAIL_REASON_CODES:\n                return self._warn(claim, "UNSAFE_FAIL_REASON", reason or "FAIL 사유가 허용 범위를 벗어남")\n'''
          replacement = marker + '''            if severity is not RepairSeverity.MINOR:\n                return self._warn(claim, "AUTO_PATCH_SCOPE_TOO_WIDE", "문장/문단 재작성은 자동 반영하지 않음")\n'''
          text = text.replace(marker, replacement, 1)

          # PatchGuard and RepairCoordinator never allow claim/paragraph rewrite automatically.
          start = text.index('class PatchGuard:')
          end = text.index('\n\nclass RepairCoordinator:', start)
          patch_guard = '''class PatchGuard:\n    """Only an exact verifier-selected span may be changed automatically."""\n\n    @staticmethod\n    def apply(claim: Claim, finding: VerificationFinding, replacement: str) -> str | None:\n        replacement = str(replacement or "").strip()\n        if not replacement or finding.severity is not RepairSeverity.MINOR:\n            return None\n        span = str(finding.problem_span or "")\n        if not span or span not in claim.text:\n            return None\n        if len(replacement) > max(120, len(span) * 2):\n            return None\n        return claim.text.replace(span, replacement, 1)\n'''
          text = text[:start] + patch_guard + text[end:]
          text = text.replace(
              '''        for _ in range(self.max_attempts):\n            if finding.severity is RepairSeverity.MINOR:\n                output_rule = "문장 전체가 아니라 problem_span을 대체할 문자열만 출력한다."\n            else:\n                output_rule = "해당 claim 하나만 다시 작성한다. 다른 문장이나 설명을 출력하지 않는다."\n            messages = [\n''',
              '''        if finding.severity is not RepairSeverity.MINOR:\n            return None\n        for _ in range(self.max_attempts):\n            output_rule = "문장 전체가 아니라 problem_span을 대체할 문자열만 출력한다."\n            messages = [\n''',
              1,
          )
          p.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # 4. Completion Guard + one automatic verifier patch per section.
          # ------------------------------------------------------------------
          p = root/'src/semantic_prompt_transfer/orchestration.py'
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '_CITATION = re.compile(r"(?:CR|ATT)_[a-f0-9]{20}", re.IGNORECASE)\n',
              '_CITATION = re.compile(r"(?:CR|ATT)_[a-f0-9]{20}", re.IGNORECASE)\n'
              '_COMPLETE_SUFFIXES = ("함", "임", "됨", "음", "필요함", "양호함", "판단됨", "예상됨", "전망됨", "확인됨")\n'
              '_INCOMPLETE_SUFFIXES = ("등에", "으로", "하며", "하고", "및", "따라", "대해", "대한", "에서", "위해", "통해", "반면", "이나", "지만", "경우", "때문에")\n',
              1,
          )
          text = text.replace(
              '        verifier: VerificationAgent | None = None,\n    ) -> None:',
              '        verifier: VerificationAgent | None = None,\n        max_auto_patches_per_section: int = 1,\n        max_completion_attempts: int = 2,\n    ) -> None:',
              1,
          )
          text = text.replace(
              '        self.repair = RepairCoordinator(max_repair_attempts)\n',
              '        self.repair = RepairCoordinator(max_repair_attempts)\n        self.max_auto_patches_per_section = max(0, int(max_auto_patches_per_section))\n        self.max_completion_attempts = max(0, int(max_completion_attempts))\n',
              1,
          )
          insertion_point = text.index('    @staticmethod\n    def _cited_ids')
          methods = r'''    @classmethod
    def _looks_complete(cls, text: str) -> bool:
        visible = _CITATION.sub("", str(text or "")).strip()
        visible = re.sub(r"\s+", " ", visible).rstrip()
        if not visible:
            return False
        if visible.endswith((".", "!", "?", "。")):
            return True
        if any(visible.endswith(suffix) for suffix in _COMPLETE_SUFFIXES):
            return True
        if visible.endswith((",", ";", ":", "·", "-")):
            return False
        if any(visible.endswith(suffix) for suffix in _INCOMPLETE_SUFFIXES):
            return False
        return False

    @staticmethod
    def _novel_continuation(base: str, continuation: str) -> str:
        value = str(continuation or "").strip()
        if not value:
            return ""
        if value.startswith(base):
            return value[len(base):].lstrip()
        maximum = min(240, len(base), len(value))
        for size in range(maximum, 12, -1):
            if base[-size:] == value[:size]:
                return value[size:].lstrip()
        return value

    def _ensure_complete(
        self,
        *,
        case: CaseContext,
        job_id: str,
        item: ReviewItem,
        prompt: ReviewPromptPackage,
        generator: TextGenerator,
        text: str,
        token_callback: Callable[[ReviewItem, str], None] | None,
    ) -> str:
        current = str(text or "").strip()
        if self._looks_complete(current):
            return current
        for attempt in range(1, self.max_completion_attempts + 1):
            messages = [
                *[dict(row) for row in prompt.messages],
                {"role": "assistant", "content": current},
                {
                    "role": "user",
                    "content": (
                        "직전 심사의견의 마지막 문장이 중간에서 끊겼다. 이미 작성한 내용을 반복하거나 "
                        "새 분석 포인트를 추가하지 말고, 끊긴 마지막 문장만 자연스럽게 이어서 완결하라. "
                        "출력은 이어질 문자열만 작성한다."
                    ),
                },
            ]
            try:
                continuation = str(generator.generate(messages) or "").strip()
            except Exception as exc:
                self._audit(case, job_id, "GENERATION_COMPLETION_ERROR", {
                    "item": item.value, "attempt": attempt,
                    "error_type": type(exc).__name__, "message": str(exc)[:500],
                })
                break
            addition = self._novel_continuation(current, continuation)
            if not addition:
                break
            current = current.rstrip() + ("" if current.endswith((" ", "\n")) else " ") + addition.lstrip()
            if token_callback:
                token_callback(item, addition)
            self._audit(case, job_id, "GENERATION_COMPLETION_CONTINUED", {
                "item": item.value, "attempt": attempt,
            })
            if self._looks_complete(current):
                break
        return current.strip()

'''
          text = text[:insertion_point] + methods + text[insertion_point:]

          # Completion guard after both primary and retry generation.
          old = '''            if text:\n                return text, False\n            raise RuntimeError("empty generation")\n'''
          new = '''            if text:\n                text = self._ensure_complete(\n                    case=case, job_id=job_id, item=item, prompt=prompt, generator=generator,\n                    text=text, token_callback=token_callback,\n                )\n                return text, False\n            raise RuntimeError("empty generation")\n'''
          text = text.replace(old, new, 1)
          old_retry = '''                text = self._generate_once(generator, prompt.messages)\n                if text:\n                    return text, True\n'''
          new_retry = '''                text = self._generate_once(generator, prompt.messages)\n                if text:\n                    text = self._ensure_complete(\n                        case=case, job_id=job_id, item=item, prompt=prompt, generator=generator,\n                        text=text, token_callback=None,\n                    )\n                    return text, True\n'''
          text = text.replace(old_retry, new_retry, 1)

          # At most one automatic verifier patch per section, earliest failing claim first.
          old_loop = '''        repaired_any = False\n        current = text\n        # Reverse order preserves the original offsets. The current slice is the only\n        # mutable scope, so another claim can never be rewritten by this repair.\n        for claim, finding in sorted(findings, key=lambda pair: pair[0].start, reverse=True):\n            if finding.status is not VerificationStatus.FAIL:\n                continue\n'''
          new_loop = '''        repaired_any = False\n        current = text\n        patch_count = 0\n        for claim, finding in sorted(findings, key=lambda pair: pair[0].start):\n            if finding.status is not VerificationStatus.FAIL:\n                continue\n            if patch_count >= self.max_auto_patches_per_section:\n                break\n'''
          if old_loop not in text:
              raise RuntimeError('verification loop target missing')
          text = text.replace(old_loop, new_loop, 1)
          text = text.replace(
              '            repaired_any = True\n            if patch_callback:\n',
              '            repaired_any = True\n            patch_count += 1\n            if patch_callback:\n',
              1,
          )
