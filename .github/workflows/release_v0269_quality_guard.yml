name: Release v0.26.9 quality guard

on:
  push:
    paths:
      - '.github/workflows/release_v0269_quality_guard.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch v0.26.9
        run: python tools/patch_v0269_quality_guard.py

      - name: Install and validate
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -e '.[poc]' pytest build >/dev/null
          pytest -q
          python -m compileall -q src tests
          python -c "import semantic_prompt_transfer as spt; assert spt.__version__ == '0.26.9'; assert not hasattr(spt, 'FallbackGenerator')"
          python -c "from pathlib import Path; t=Path('src/semantic_prompt_transfer/llm.py').read_text(); assert 'class FallbackGenerator' not in t"
          python -c "from pathlib import Path; t=Path('src/semantic_prompt_transfer/poc_bootstrap.py').read_text(); assert 'FallbackGenerator(' not in t"
          python -c "import json; from pathlib import Path; nb=json.loads(Path('notebooks/SemanticPromptTransfer_v0.26.9_COLAB_LAUNCHER.ipynb').read_text()); [compile(''.join(c.get('source',[])),f'cell-{i}','exec') for i,c in enumerate(nb['cells']) if c.get('cell_type')=='code']"
          python -c "from pathlib import Path; t=Path('notebooks/SemanticPromptTransfer_v0.26.9_COLAB_LAUNCHER.ipynb').read_text(); assert 'max_new_tokens=1800' in t; assert '136,281' in t; assert '500,000, 2024년 575,000' not in t"

      - name: Build release assets
        run: |
          rm -rf dist release_v0269
          python -m build --wheel >/dev/null
          python tools/build_v0269_release.py

      - name: Revalidate final tree
        run: |
          pytest -q
          python -m compileall -q src tests

      - name: Commit validated v0.26.9
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests pyproject.toml CHANGELOG.md notebooks/SemanticPromptTransfer_v0.26.9_COLAB_LAUNCHER.ipynb notebooks/SemanticPromptTransfer_v0.26.9_COLAB_ASSETS.json docs/VALIDATION_v0.26.9.md
          git commit -m 'Release v0.26.9 conservative verifier quality guard'
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: SemanticPromptTransfer-v0.26.9-release
          path: release_v0269/*
