              p.write_text(t, encoding='utf-8')

          src = root/'notebooks/SemanticPromptTransfer_v0.26.8_COLAB_LAUNCHER.ipynb'
          dst = root/'notebooks/SemanticPromptTransfer_v0.26.9_COLAB_LAUNCHER.ipynb'
          notebook = src.read_text(encoding='utf-8')
          notebook = notebook.replace('v0.26.8', 'v0.26.9').replace('0.26.8', '0.26.9').replace('v0268', 'v0269')
          notebook = notebook.replace('max_new_tokens=1400', 'max_new_tokens=1800')
          dst.write_text(notebook, encoding='utf-8')

          # Focused tests.
          (root/'tests/test_v0269_quality_guard.py').write_text(r'''from semantic_prompt_transfer.domain import CreditFact, EvidenceRecord, ReviewItem, SourceTier
from semantic_prompt_transfer.review import EvidenceAssembler
from semantic_prompt_transfer.verification_flow import Claim, LLMVerificationAgent, VerificationStatus
from semantic_prompt_transfer.orchestration import ReviewGenerationOrchestrator


class JsonGenerator:
    def __init__(self, value): self.value = value
    def generate(self, messages): return self.value


def test_credit_won_is_normalized_to_million():
    fact = CreditFact("f","x","총차입금",164134131441,"원","2025",(ReviewItem.MAJOR_ACCOUNTS,),False,"d","c.xlsx","S","A1")
    rows = EvidenceAssembler().assemble(ReviewItem.MAJOR_ACCOUNTS,[fact],{"hits":[]})
    assert "164,134.1" in rows[0].content and "단위=백만원" in rows[0].content
    assert "164134131441" not in rows[0].content


def test_unsupported_claim_is_not_auto_fail():
    claim = Claim("A-001", ReviewItem.MAJOR_ACCOUNTS, "원가 부담이 확대됨.", 0, 11, (), 1)
    raw = '{"status":"FAIL","severity":"MINOR","problem_span":"원가 부담","reason_code":"UNSUPPORTED_CAUSAL","reason":"근거 부족","evidence_ids":["CR_00000000000000000001"],"repair_instruction":"삭제"}'
    ev = EvidenceRecord("CR_00000000000000000001",ReviewItem.MAJOR_ACCOUNTS,SourceTier.CREDIT_REPORT_ITEM,"매출액=100; 단위=백만원","d","c.xlsx")
    result = LLMVerificationAgent(JsonGenerator(raw)).verify(claim,[ev])
    assert result.status is VerificationStatus.WARN


def test_claim_level_rewrite_is_not_auto_fail():
    claim = Claim("A-001", ReviewItem.MAJOR_ACCOUNTS, "총차입금은 100백만원임.", 0, 15, (), 1)
    raw = '{"status":"FAIL","severity":"CLAIM_ERROR","problem_span":"100백만원","reason_code":"FACT_CONTRADICTION","reason":"불일치","evidence_ids":["CR_00000000000000000001"],"repair_instruction":"수정"}'
    ev = EvidenceRecord("CR_00000000000000000001",ReviewItem.MAJOR_ACCOUNTS,SourceTier.CREDIT_REPORT_ITEM,"총차입금=120; 단위=백만원","d","c.xlsx")
    result = LLMVerificationAgent(JsonGenerator(raw)).verify(claim,[ev])
    assert result.status is VerificationStatus.WARN


def test_completion_detection():
    assert not ReviewGenerationOrchestrator._looks_complete("재고 증가 등에")
    assert not ReviewGenerationOrchestrator._looks_complete("차입금 증가에 따라")
    assert ReviewGenerationOrchestrator._looks_complete("총차입금 증가 추세임")
    assert ReviewGenerationOrchestrator._looks_complete("수익성 개선됨.")
'''.replace('\\n','\n'), encoding='utf-8')

          # Changelog.
          changelog = root/'CHANGELOG.md'
          current = changelog.read_text(encoding='utf-8')
          entry = '''## 0.26.9 - 2026-09-01\n\n- Deleted FallbackGenerator from runtime, public exports, and tests.\n- Restricted automatic verifier mutation to exact MINOR spans for hard evidence conflicts, at most one patch per review section.\n- Normalized structured monetary evidence to 백만원 and instructed generation not to mix 원/천원/만원 units.\n- Added a completion guard that continues a prematurely ended Korean review sentence without introducing new analysis.\n- Increased the Colab per-call output budget from 1400 to 1800 tokens while retaining continuation support.\n\n'''
          if '## 0.26.9 - 2026-09-01' not in current:
              changelog.write_text(entry + current, encoding='utf-8')

          print('v0.26.9 patch complete')
          PY
          python /tmp/patch_v0269.py

      - name: Install and validate
        shell: bash
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -e '.[poc]' pytest build >/dev/null
          pytest -q
          python -m compileall -q src tests
          python - <<'PY'
          import json
          from pathlib import Path
          from semantic_prompt_transfer import __version__
          assert __version__ == '0.26.9'
          import semantic_prompt_transfer as spt
          assert not hasattr(spt, 'FallbackGenerator')
          llm = Path('src/semantic_prompt_transfer/llm.py').read_text(encoding='utf-8')
          assert 'class FallbackGenerator' not in llm
          boot = Path('src/semantic_prompt_transfer/poc_bootstrap.py').read_text(encoding='utf-8')
          assert 'FallbackGenerator(' not in boot
          nb = json.loads(Path('notebooks/SemanticPromptTransfer_v0.26.9_COLAB_LAUNCHER.ipynb').read_text(encoding='utf-8'))
          code = '\n'.join(''.join(c.get('source',[])) for c in nb['cells'] if c.get('cell_type')=='code')
          for i,c in enumerate(nb['cells']):
              if c.get('cell_type')=='code': compile(''.join(c.get('source',[])),f'cell-{i}','exec')
          assert 'max_new_tokens=1800' in code
          assert '136,281' in code and '500,000, 2024년 575,000' not in code
          print('quality guard validation passed')
          PY

      - name: Build release assets
        shell: bash
        run: |
          rm -rf dist release_v0269
          python -m build --wheel >/dev/null
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.'); out=root/'release_v0269'; out.mkdir()
          wheel=next((root/'dist').glob('semantic_prompt_transfer-0.26.9-*.whl'))
          launcher=root/'notebooks/SemanticPromptTransfer_v0.26.9_COLAB_LAUNCHER.ipynb'
          tw=out/wheel.name; tl=out/launcher.name
          tw.write_bytes(wheel.read_bytes()); tl.write_bytes(launcher.read_bytes())
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          manifest={
            'schema_version':3,'release':'v0.26.9','package_version':'0.26.9',
            'drive_root':'/content/drive/MyDrive/SemanticPromptTransfer','runtime_root':'/content/spt_poc_runtime','stage_root':'/content/spt_bootstrap_v0269',
            'base_asset_manifest':'runtime-assets/v0.26.3/SemanticPromptTransfer_v0.26.3_COLAB_ASSETS.json',
            'assets':[{'role':'wheel','source':f'versions/v0.26.9/{tw.name}','target':f'release/{tw.name}','size':tw.stat().st_size,'sha256':sha(tw)}],
            'demo_assets':[{'role':'credit_report','source':'demo-assets/신용조사서_ABC기업_v1.0.xlsx','processing':'deferred_until_review'},{'role':'attachment','source':'demo-assets/[ABC기업]사업보고서(2026.03.23).pdf','processing':'deferred_until_review'}]
          }
          mp=out/'SemanticPromptTransfer_v0.26.9_COLAB_ASSETS.json'; mp.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'notebooks/SemanticPromptTransfer_v0.26.9_COLAB_ASSETS.json').write_text(mp.read_text(encoding='utf-8'),encoding='utf-8')
          validation=f'''# SemanticPromptTransfer v0.26.9 검증 기록\n\n- FallbackGenerator 코드/공개 export/테스트에서 완전 삭제\n- 운영 생성 lane은 Gemma primary 직접 streaming\n- 검증 LLM 자동수정은 hard conflict + MINOR exact span만 허용, 섹션당 최대 1회\n- 금액 evidence를 백만원 기준으로 정규화\n- 문장 미완결 Completion Guard 추가\n- max_new_tokens 1800 + 기존 continuation 유지\n- 자유대화 verifier 미적용 유지\n- 전체 pytest / compileall / Colab code-cell compile 통과\n\n## 산출물\n| 산출물 | 크기 | SHA-256 |\n|---|---:|---|\n| {tw.name} | {tw.stat().st_size:,} | `{sha(tw)}` |\n| {tl.name} | {tl.stat().st_size:,} | `{sha(tl)}` |\n| {mp.name} | {mp.stat().st_size:,} | `{sha(mp)}` |\n'''
          (out/'VALIDATION_v0.26.9.md').write_text(validation,encoding='utf-8')
          (root/'docs/VALIDATION_v0.26.9.md').write_text(validation,encoding='utf-8')
          (out/'COLAB_ONE_CLICK_v0.26.9.md').write_text('# SemanticPromptTransfer v0.26.9\n\nDrive `versions/v0.26.9`의 Colab launcher를 열고 위에서부터 실행합니다.\n',encoding='utf-8')
          print(validation)
          PY

      - name: Revalidate final tree
        run: |
          pytest -q
          python -m compileall -q src tests

      - name: Commit validated v0.26.9
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests pyproject.toml CHANGELOG.md notebooks/SemanticPromptTransfer_v0.26.9_COLAB_LAUNCHER.ipynb notebooks/SemanticPromptTransfer_v0.26.9_COLAB_ASSETS.json docs/VALIDATION_v0.26.9.md
          git commit -m 'Release v0.26.9 conservative verifier quality guard'
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: SemanticPromptTransfer-v0.26.9-release
          path: release_v0269/*
