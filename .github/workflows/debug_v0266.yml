name: Debug v0.26.6 integration failures

on:
  push:
    branches: [main]
    paths:
      - '.github/v0266_debug.trigger'

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Expose swallowed tracebacks and run targeted tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/semantic_prompt_transfer/orchestration.py')
          t=p.read_text(encoding='utf-8')
          old='''        except Exception as exc:\n            return self._emergency_result(case, job_id, output_path, prompts, events, progress_callback, exc)\n'''
          new='''        except Exception as exc:\n            import traceback\n            traceback.print_exc()\n            return self._emergency_result(case, job_id, output_path, prompts, events, progress_callback, exc)\n'''
          assert old in t
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          python -m pip install -e '.[poc]' pytest >/dev/null
          pytest -q -s tests/test_colab_poc.py::ColabPocTests::test_review_job_streams_five_sections_and_captures_credit_evidence tests/test_colab_poc.py::ColabPocTests::test_review_job_uses_attachment_only_rag_without_credit_report
