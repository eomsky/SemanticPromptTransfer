name: Publish Python package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build --outdir release-dist

      - name: Check package metadata
        run: python -m twine check release-dist/*

      - name: Install wheel
        run: python -m pip install release-dist/*.whl

      - name: Run tests against installed wheel
        run: python -m unittest discover -s tests -v

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: release-dist/
          if-no-files-found: error

  publish-to-pypi:
    name: Publish to PyPI
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/semantic-prompt-transfer
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
