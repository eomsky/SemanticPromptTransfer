[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-prompt-transfer"
version = "0.24.0"
description = "Time-boxed Colab POC runtime for operational credit-review RAG"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{name = "SemanticPromptTransfer"}]
keywords = ["rag", "retrieval", "chunking", "table", "document-ai", "onnx"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "numpy>=1.26,<3.0",
  "onnxruntime>=1.22,<2.0",
  "tokenizers>=0.22,<1.0",
  "openpyxl>=3.1,<4.0",
  "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
chroma = ["chromadb>=1.0,<2.0"]
llm-cpu = ["transformers>=4.48,<6.0", "torch>=2.2,<3.0", "accelerate>=1.0,<2.0"]
web = ["fastapi>=0.115,<1.0", "python-multipart>=0.0.20,<1.0", "uvicorn>=0.34,<1.0"]
poc = [
  "fastapi>=0.115,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn>=0.34,<1.0",
  "pypdf>=5.0,<7.0",
  "pymupdf>=1.25,<2.0",
  "pillow>=10.0,<13.0",
]

[project.urls]
Homepage = "https://github.com/eomsky/SemanticPromptTransfer"
Repository = "https://github.com/eomsky/SemanticPromptTransfer"
Documentation = "https://github.com/eomsky/SemanticPromptTransfer/tree/main/docs"
Issues = "https://github.com/eomsky/SemanticPromptTransfer/issues"

[project.scripts]
spt-rag = "semantic_prompt_transfer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
semantic_prompt_transfer = [
  "py.typed",
  "examples/stx_engine/*.json",
  "examples/stx_engine/*.md",
  "examples/operational/*.json",
  "examples/operational/*.md",
  "examples/operational/*.html",
  "examples/operational/*.xlsx"
]
