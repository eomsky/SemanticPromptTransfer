[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-prompt-transfer"
version = "0.20.0"
description = "Operational credit-review RAG with source tiers, loan-type few-shot selection, lifecycle controls, and evidence prompts"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{name = "SemanticPromptTransfer"}]
keywords = ["rag", "retrieval", "chunking", "table", "document-ai", "onnx"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "numpy>=1.26,<3.0",
  "onnxruntime>=1.22,<2.0",
  "tokenizers>=0.22,<1.0",
  "openpyxl>=3.1,<4.0",
  "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
chroma = ["chromadb>=1.0,<2.0"]

[project.urls]
Homepage = "https://github.com/eomsky/SemanticPromptTransfer"
Repository = "https://github.com/eomsky/SemanticPromptTransfer"
Documentation = "https://github.com/eomsky/SemanticPromptTransfer/tree/main/docs"
Issues = "https://github.com/eomsky/SemanticPromptTransfer/issues"

[project.scripts]
spt-rag = "semantic_prompt_transfer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
semantic_prompt_transfer = [
  "py.typed",
  "examples/stx_engine/*.json",
  "examples/stx_engine/*.md",
  "examples/operational/*.json",
  "examples/operational/*.md"
]
